{% extends "base.html" %}
{% block title %}Слова{% endblock %}
{% block content %}
<h1>Слова<span class="jp">単語</span></h1>

<form class="word-form" id="add-form" autocomplete="off">
  <input type="text" id="f-kanji" placeholder="漢字 (необязательно)" size="12">
  <input type="text" id="f-kana" placeholder="かな *" size="12" required>
  <input type="text" id="f-ru" placeholder="перевод; варианты через ; *" size="24" required>
  <input type="text" id="f-level" placeholder="метка" size="8">
  <button class="btn" type="submit">Добавить</button>
  <label class="btn ghost" style="cursor:pointer">
    Импорт CSV
    <input type="file" id="csv-file" accept=".csv" hidden>
  </label>
  <span id="form-msg" style="color:var(--ink-soft);font-size:.85rem"></span>
</form>

<div class="toolbar">
  <input type="text" id="search" placeholder="Поиск: кандзи, кана или перевод">
  <select id="filter-source">
    <option value="">Все источники</option>
    <option value="jlpt">JLPT</option>
    <option value="minna">Minna no Nihongo</option>
    <option value="custom">Свои</option>
  </select>
</div>

<table>
  <thead>
    <tr><th>Кандзи</th><th>Кана</th><th>Перевод</th><th>Источник</th><th></th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
{% endblock %}

{% block scripts %}
<script>
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

async function loadWords() {
  const q = document.getElementById("search").value;
  const source = document.getElementById("filter-source").value;
  const words = await (await fetch(`/api/words?q=${encodeURIComponent(q)}&source=${source}`)).json();
  document.getElementById("rows").innerHTML = words.map(w => `
    <tr>
      <td class="jp">${esc(w.kanji)}</td>
      <td class="jp">${esc(w.kana)}</td>
      <td>${esc(w.ru)}</td>
      <td>${esc(w.source)}${w.level ? " · " + esc(w.level) : ""}</td>
      <td><button class="del" onclick="delWord(${w.id})" aria-label="Удалить">удалить</button></td>
    </tr>`).join("");
}

async function delWord(id) {
  if (!confirm("Удалить слово вместе с прогрессом по нему?")) return;
  await fetch(`/api/words/${id}`, { method: "DELETE" });
  loadWords();
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("form-msg");
  const res = await fetch("/api/words", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      kanji: document.getElementById("f-kanji").value,
      kana: document.getElementById("f-kana").value,
      ru: document.getElementById("f-ru").value,
      level: document.getElementById("f-level").value,
    }),
  });
  if (res.ok) {
    msg.textContent = "Добавлено";
    e.target.reset();
    loadWords();
  } else {
    msg.textContent = (await res.json()).detail || "Не получилось добавить";
  }
});

document.getElementById("csv-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch("/api/words/import", { method: "POST", body: fd });
  const msg = document.getElementById("form-msg");
  if (res.ok) {
    const r = await res.json();
    msg.textContent = `Импорт: добавлено ${r.added}, пропущено ${r.skipped}`;
    loadWords();
  } else {
    msg.textContent = (await res.json()).detail || "Ошибка импорта";
  }
  e.target.value = "";
});

let searchTimer;
document.getElementById("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadWords, 250);
});
document.getElementById("filter-source").addEventListener("change", loadWords);

loadWords();
</script>
{% endblock %}

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Тренажёр японского{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="hanko" aria-hidden="true">語</div>
  <div class="brand">Тренажёр японского<small>ことばの練習</small></div>
  <nav>
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Колоды</a>
    <a href="/words" class="{% if request.url.path == '/words' %}active{% endif %}">Слова</a>
    <a href="/stats" class="{% if request.url.path == '/stats' %}active{% endif %}">Статистика</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>

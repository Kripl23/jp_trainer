; supervisord запускается из .venv проекта:
;   .venv/bin/supervisord -c supervisord.conf
[supervisord]
directory=%(here)s
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/logs/supervisord.pid
childlogdir=%(here)s/logs
nodaemon=false

[unix_http_server]
file=%(here)s/logs/supervisor.sock

[supervisorctl]
serverurl=unix://%(here)s/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; порт должен совпадать с PORT в .env (по умолчанию 8040)
[program:jp_trainer]
command=%(here)s/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8040
directory=%(here)s
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
stdout_logfile=%(here)s/logs/uvicorn.log
stderr_logfile=%(here)s/logs/uvicorn_err.log
